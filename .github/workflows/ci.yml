name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: mvn clean verify (unit + Testcontainers integration)
        run: mvn -B clean verify
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inventory" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        run: |
          mvn -B -DskipTests package
          nohup java -jar target/inventory-app-1.0.0.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/products > /dev/null && exit 0
            sleep 2
          done
          echo "backend did not start"; cat /tmp/backend.log; exit 1
        working-directory: backend

      - name: Assert the intended stack is actually running
        run: |
          set -euo pipefail
          grep -Eq "Starting InventoryApplication .*using Java 17" /tmp/backend.log
          unzip -p backend/target/inventory-app-1.0.0.jar META-INF/MANIFEST.MF \
            | tr -d '\r' | grep -q "^Spring-Boot-Version: 3"
          # Flyway applied cleanly on PostgreSQL and ddl-auto=validate passed at startup.
          PGPASSWORD=inventory psql -h localhost -U inventory -d inventory -tAc \
            "select count(*) from flyway_schema_history where success" | grep -qx 4
          PGPASSWORD=inventory psql -h localhost -U inventory -d inventory -tAc \
            "select numeric_scale from information_schema.columns
              where table_name='product' and column_name='price'" | grep -qx 0
          PGPASSWORD=inventory psql -h localhost -U inventory -d inventory -tAc \
            "select is_nullable from information_schema.columns
              where table_name='orders' and column_name='customer_id'" | grep -qx NO
          # Insufficient stock rolls the whole order back (HTTP 409, stock untouched).
          before=$(curl -sf http://localhost:8080/api/products | jq '.[0].stockQuantity')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"customerName":"CI","items":[{"productId":1,"quantity":1},{"productId":3,"quantity":999}]}' \
            http://localhost:8080/api/orders)
          [ "$code" = "409" ]
          [ "$(curl -sf http://localhost:8080/api/products | jq '.[0].stockQuantity')" = "$before" ]
          [ "$(curl -sf http://localhost:8080/api/orders | jq '[.[] | select(.customerName=="CI")] | length')" = "0" ]
          # CORS: only the configured frontend origin is allowed.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: http://localhost:5173' \
            -H 'Access-Control-Request-Method: POST' http://localhost:8080/api/orders)" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: http://evil.example.com' \
            -H 'Access-Control-Request-Method: POST' http://localhost:8080/api/orders)" = "403" ]

      - name: Playwright E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            /tmp/backend.log
