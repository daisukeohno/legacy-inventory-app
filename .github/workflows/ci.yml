name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        working-directory: backend
        run: mvn --batch-mode test

  frontend:
    name: frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: e2e (Playwright against PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package backend
        working-directory: backend
        run: mvn --batch-mode -DskipTests package
      - name: Start backend
        working-directory: backend
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/products > /dev/null && exit 0
            sleep 2
          done
          echo "backend did not become ready"
          cat backend.log
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run Playwright tests
        working-directory: frontend
        run: npm run e2e
      - name: Backend log
        if: failure()
        working-directory: backend
        run: cat backend.log
