spring:
  application:
    name: inventory-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # 低在庫と判定するしきい値(この値未満)。将来は商品ごとの上書きに拡張可能。
  low-stock-threshold: ${APP_LOW_STOCK_THRESHOLD:10}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.example.inventory: INFO
