spring:
  application:
    name: inventory-backend
  profiles:
    default: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo

app:
  inventory:
    low-stock-threshold: 10
  cors:
    # フロントエンドのオリジンのみ許可する。APIは外部非公開前提。
    allowed-origins:
      - http://localhost:5173

logging:
  level:
    com.example.inventory: INFO
