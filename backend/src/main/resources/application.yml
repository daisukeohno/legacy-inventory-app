spring:
  application:
    name: inventory-backend
  profiles:
    # 既定は PostgreSQL。デモ/インメモリで動かす場合は SPRING_PROFILES_ACTIVE=h2
    default: postgres
  datasource:
    # 接続情報はハードコードせず環境変数で上書き可能にする(旧 DbUtil の定数を置き換え)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    open-in-view: false
    hibernate:
      # スキーマはFlywayを正とする
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

inventory:
  # 低在庫しきい値(旧 Product.isLowStock() のマジックナンバー 10 を外部化)
  low-stock-threshold: 10

logging:
  level:
    com.example.inventory: INFO
