spring:
  application:
    name: inventory-app
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

inventory:
  low-stock-threshold: ${INVENTORY_LOW_STOCK_THRESHOLD:10}
  cors:
    allowed-origins: ${INVENTORY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.example.inventory: INFO

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: ${DB_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;MODE=LEGACY}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
